<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bed Information System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<style>
    /* Toast Animation */
    @keyframes slideIn {
        from {
            transform: translateX(100%);
        }

        to {
            transform: translateX(0);
        }
    }

    @keyframes fadeOut {
        from {
            opacity: 1;
        }

        to {
            opacity: 0;
        }
    }

    .toast {
        animation: slideIn 0.3s ease-out;
    }

    .toast-exit {
        animation: fadeOut 0.3s ease-out forwards;
    }
</style>
<script>
    tailwind.config = {
        darkMode: 'class',
    }
</script>
</head>

<body class="bg-gray-50 dark:bg-gray-900 transition-colors duration-200">
    <div id="toast-container" class="fixed top-4 right-4 z-50 space-y-2"></div>

    <script>
        // Dark Mode Logic
        if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark')
        } else {
            document.documentElement.classList.remove('dark')
        }

        function toggleDarkMode() {
            if (document.documentElement.classList.contains('dark')) {
                document.documentElement.classList.remove('dark');
                localStorage.theme = 'light';
            } else {
                document.documentElement.classList.add('dark');
                localStorage.theme = 'dark';
            }
        }

        // Toast Notification Logic
        function showToast(message, type = 'info') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');

            let bgClass = 'bg-blue-500';
            let icon = 'ℹ️';

            if (type === 'success') { bgClass = 'bg-green-500'; icon = '✅'; }
            if (type === 'error') { bgClass = 'bg-red-500'; icon = '❌'; }
            if (type === 'warning') { bgClass = 'bg-yellow-500'; icon = '⚠️'; }

            toast.className = `${bgClass} text-white px-6 py-3 rounded-lg shadow-lg flex items-center space-x-3 toast mb-3 transform transition-all duration-300`;
            toast.innerHTML = `<span>${icon}</span><span class="font-medium">${message}</span>`;

            container.appendChild(toast);

            setTimeout(() => {
                toast.classList.add('toast-exit');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }
    </script>

    {% block content %}{% endblock %}
</body>

</html>
